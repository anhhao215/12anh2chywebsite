<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Thư 20/10 12 Anh 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Mali:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html{color-scheme:light}
    :root{
      --bg:#f6eeff; --bg-dot:#d4c0f5;
      --ink:#1c1033; --ink-soft:#5d4a7e; --error:#d6104f;
      --card:#ffffff; --field:#fbf6ff; --line:#1c1033; --hard:#1c1033;
      --pink:#ff4fa3; --yellow:#ffd83d; --mint:#4fe0b5; --blue:#7a95ff; --on-pop:#1c1033;
      --paper:#fffefa; --paper-ink:#1c1033; --paper-line:#c4d4ff; --paper-margin:#ff8fbf; --paper-accent:#d6247f;
      --display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
      --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
      --hand:'Mali','Segoe Print','Comic Sans MS',cursive;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#140a24; --bg-dot:#2b1850;
        --ink:#fdf2ff; --ink-soft:#c9b3e6; --error:#ff8aa9;
        --card:#241238; --field:#170b29; --line:#f1e2ff; --hard:#000000;
        color-scheme:dark;
      }
    }
    :root[data-theme="dark"]{
      --bg:#140a24; --bg-dot:#2b1850;
      --ink:#fdf2ff; --ink-soft:#c9b3e6; --error:#ff8aa9;
      --card:#241238; --field:#170b29; --line:#f1e2ff; --hard:#000000;
      color-scheme:dark;
    }

    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{
      margin:0; min-height:100dvh;
      background:var(--bg);
      background-image:radial-gradient(var(--bg-dot) 1.6px, transparent 1.8px);
      background-size:22px 22px;
      color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.6;
      padding-block:28px 0;
      padding-left:max(16px, env(safe-area-inset-left, 0px));
      padding-right:max(16px, env(safe-area-inset-right, 0px));
      overflow-x:hidden;
    }
    h1,h2,p{margin:0}
    .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
    #confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50}
    .stage{position:relative; z-index:1; max-width:1060px; margin-inline:auto}

    .rise{animation:rise .8s cubic-bezier(.34,1.4,.64,1) backwards; animation-delay:calc(var(--i,0) * 90ms + 80ms)}

    .gate{position:relative; display:grid; grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr); gap:clamp(28px,5vw,64px); align-items:center; min-height:calc(100dvh - 190px)}
    .gate.out{animation:fadeOut .45s ease both}
    .hero{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:10px; min-width:0}

    .tag{display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; color:var(--on-pop); background:var(--mint); border:3px solid var(--line); border-radius:999px; padding:5px 16px 5px 12px; box-shadow:3px 3px 0 var(--hard); transform:rotate(-3deg)}
    .tag svg{width:18px; height:18px; fill:var(--yellow); stroke:var(--on-pop); stroke-width:1.6; stroke-linejoin:round}

    .big{display:flex; width:max-content; max-width:100%; font-family:var(--display); font-weight:800; font-size:clamp(5.6rem,21vw,11.5rem); line-height:.88; letter-spacing:-.02em; margin:8px 0 6px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; transform-origin:0 100%; transform:rotate(-4deg); animation:sway 6s ease-in-out 1.6s infinite}
    .big .ch{display:inline-block; color:var(--c); -webkit-text-stroke:3px var(--line); paint-order:stroke fill; text-shadow:5px 6px 0 var(--hard); animation:bounceIn .9s cubic-bezier(.34,1.56,.64,1) backwards; animation-delay:calc(.15s + var(--i) * 90ms)}

    h1{font-family:var(--display); font-weight:700; font-size:clamp(1.7rem,4.2vw,2.5rem); line-height:1.22; text-wrap:balance; max-width:18ch}
    h1 mark{display:inline-block; color:var(--on-pop); background:var(--yellow); padding:0 .22em; border-radius:10px; transform:rotate(-1.2deg); animation:wipe .8s cubic-bezier(.2,.8,.2,1) .9s backwards}
    .sub{color:var(--ink-soft); font-size:1.05rem; max-width:34ch}

    .sticker{position:absolute; width:var(--w,44px); height:var(--w,44px); color:var(--c); fill:currentColor; stroke:var(--line); stroke-width:1.6; stroke-linejoin:round; pointer-events:none; animation:bob 5s ease-in-out infinite; animation-delay:var(--d,0s)}
    .st-star{top:-14px; right:4%; --w:50px; --c:var(--yellow)}
    .st-heart{top:42%; right:-3%; --w:40px; --c:var(--pink); --d:-1.5s}
    .st-spark{bottom:-6px; right:22%; --w:34px; --c:var(--mint); --d:-3s}

    .login{position:relative; background:var(--card); border:3px solid var(--line); border-radius:24px; padding:24px; box-shadow:9px 9px 0 var(--hard); display:flex; flex-direction:column; gap:16px; transform:rotate(1deg)}
    .login h2{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:800; font-size:1.7rem; line-height:1.1}
    .login h2 svg{width:30px; height:30px; fill:var(--pink); stroke:var(--line); stroke-width:1.6; stroke-linejoin:round}
    .st-flower{top:-30px; right:-16px; --w:60px; --c:var(--blue)}
    .fields{display:flex; flex-direction:column; gap:14px}
    .fields.shake{animation:shake .45s ease}
    .field{display:flex; flex-direction:column; gap:6px; min-width:0}
    .field label{font-size:.78rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}
    .field input{width:100%; font:inherit; font-size:1rem; font-weight:500; color:var(--ink); background:var(--field); border:2.5px solid var(--line); border-radius:14px; padding:13px 15px; transition:box-shadow .15s, transform .15s}
    .field input::placeholder{color:var(--ink-soft); opacity:.65}
    .field input:focus{outline:none; transform:translate(-2px,-2px); box-shadow:4px 4px 0 var(--pink)}
    .field input[aria-invalid="true"]{border-color:var(--error)}
    .msg{min-height:1.4em; font-size:.92rem; font-weight:500; color:var(--error)}

    .btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; font-family:var(--display); font-weight:800; font-size:1.2rem; line-height:1.2; padding:12px 26px; color:var(--on-pop); background:var(--pink); border:3px solid var(--line); border-radius:16px; box-shadow:5px 5px 0 var(--hard); cursor:pointer; transition:transform .12s, box-shadow .12s}
    .btn.block{width:100%}
    .btn:hover{transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--hard)}
    .btn:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--hard)}
    .btn:focus-visible{outline:3px solid var(--blue); outline-offset:4px}
    .btn:disabled{opacity:.75; cursor:progress; transform:translate(3px,3px); box-shadow:2px 2px 0 var(--hard)}
    .btn.alt{background:var(--yellow)}
    .btn.mint{background:var(--mint)}
    .btn svg{width:22px; height:22px; fill:var(--on-pop)}

    .reveal{display:grid; justify-items:center; align-content:center; min-height:calc(100dvh - 190px); padding-top:90px}
    .envelope{width:min(88vw,400px); height:auto; overflow:visible; animation:drop .9s cubic-bezier(.34,1.56,.64,1) backwards, wiggle .7s ease .9s}
    .reveal.leaving .envelope{animation:envOut .6s ease-in both}
    .es{stroke:var(--line); stroke-width:5; stroke-linejoin:round}
    .e-shadow{fill:var(--hard); opacity:.25}
    .e-back{fill:var(--yellow)}
    .e-front{fill:var(--pink)}
    .e-flap{fill:var(--mint)}
    .e-paper{fill:var(--paper); stroke:var(--line); stroke-width:4; stroke-linejoin:round}
    .e-rule{stroke:var(--paper-line); stroke-width:3; stroke-linecap:round}
    .e-name{font-family:var(--hand); font-weight:700; fill:var(--paper-accent); text-anchor:middle}
    .e-paper-g{transition:transform 1s cubic-bezier(.34,1.3,.64,1) .35s}
    .open .e-paper-g{transform:translateY(-100px)}
    .flap-closed{transform-origin:0 0; transition:transform .3s ease-in, opacity 0s .3s}
    .flap-open{transform-origin:0 0; transform:scaleY(0); opacity:0; transition:transform .4s ease-out .3s, opacity 0s .3s}
    .open .flap-closed{transform:scaleY(0); opacity:0}
    .open .flap-open{transform:scaleY(-1); opacity:1}
    .seal{transform-origin:0 0; transition:transform .45s ease, opacity .45s ease}
    .seal circle{fill:var(--pink); stroke:var(--line); stroke-width:4}
    .broken .seal{transform:scale(1.8) rotate(25deg); opacity:0}

    .letter-wrap{max-width:640px; margin-inline:auto; padding:28px 6px 6px}
    .photo{position:relative; width:min(100%,340px); margin:0 auto 38px; padding:10px; background:var(--paper); border:3px solid var(--line); border-radius:14px; box-shadow:8px 8px 0 var(--hard); transform:rotate(1.2deg); animation:popIn .9s cubic-bezier(.34,1.45,.64,1) .05s backwards}
    .photo .frame{aspect-ratio:9/16; width:100%; max-width:100%; border-radius:6px; overflow:hidden; background:var(--bg-dot)}
    .photo img{display:block; width:100%; height:100%; object-fit:cover}
    .photo .tape{transform:rotate(3deg)}
    .letter-wrap.out{animation:fadeOut .42s ease both}
    .notebook{--lh:34px; position:relative; background-color:var(--paper); color:var(--paper-ink); border:3px solid var(--line); border-radius:16px; box-shadow:10px 10px 0 var(--hard); padding:var(--lh) 26px var(--lh) 76px;
      background-image:
        linear-gradient(90deg, transparent 56px, var(--paper-margin) 56px, var(--paper-margin) 58px, transparent 58px),
        repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 2px), var(--paper-line) calc(var(--lh) - 2px), var(--paper-line) var(--lh));
      transform:rotate(-.8deg); animation:popIn .9s cubic-bezier(.34,1.45,.64,1) backwards}
    .notebook:focus{outline:none}
    .notebook::before{content:""; position:absolute; left:14px; top:0; bottom:0; width:26px; background:radial-gradient(circle, var(--bg) 0 6px, var(--line) 6.5px 8.5px, transparent 9px) 0 17px/26px 102px repeat-y}
    .tape{position:absolute; top:-18px; left:50%; width:120px; height:34px; margin-left:-60px; background:repeating-linear-gradient(45deg, var(--yellow) 0 10px, #ffe97a 10px 20px); border:2.5px solid var(--line); transform:rotate(-3deg)}
    .greeting{font-family:var(--hand); font-weight:700; font-size:1.7rem; line-height:calc(var(--lh) * 2); color:var(--paper-accent); overflow-wrap:anywhere; text-wrap:balance}
    .text{display:block}
    .text p{margin:0 0 var(--lh); font-family:var(--hand); font-weight:500; font-size:1.02rem; line-height:var(--lh); white-space:pre-line; overflow-wrap:anywhere}
    .sign{font-family:var(--hand); font-weight:700; font-size:1.35rem; line-height:var(--lh); color:var(--paper-accent); text-align:right; white-space:pre-line; overflow-wrap:anywhere}
    .line{animation:rise .8s cubic-bezier(.34,1.4,.64,1) backwards; animation-delay:calc(.55s + var(--i,0) * .33s)}
    .actions{display:flex; flex-wrap:wrap; justify-content:center; gap:16px; margin-top:34px}
    .actions .btn{animation:rise .8s cubic-bezier(.34,1.4,.64,1) 1.3s backwards}

    .ribbons{position:relative; margin-top:46px; padding-block:30px 40px; pointer-events:none}
    .ribbon{width:120vw; margin-left:calc(50% - 60vw); overflow:hidden; border-block:3px solid var(--line); color:var(--on-pop)}
    .ribbon.a{background:var(--yellow); transform:rotate(-2deg)}
    .ribbon.b{background:var(--pink); transform:rotate(1.4deg); margin-top:-12px}
    .track{display:flex; width:max-content; animation:marquee 34s linear infinite}
    .ribbon.b .track{animation-direction:reverse}
    .group{display:flex; align-items:center; flex:none; gap:26px; padding:9px 13px; font-family:var(--display); font-weight:800; font-size:1.25rem; line-height:1.2; text-transform:uppercase; white-space:nowrap}
    .group svg{width:22px; height:22px; fill:var(--on-pop); flex:none}

    @keyframes rise{from{opacity:0; transform:translateY(18px)}}
    @keyframes fadeOut{to{opacity:0; transform:translateY(-14px) scale(.97)}}
    @keyframes bounceIn{from{opacity:0; transform:translateY(-70px) scale(.6) rotate(-14deg)}}
    @keyframes sway{0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(-1.5deg)}}
    @keyframes wipe{from{clip-path:inset(0 100% 0 0)}}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-9px) rotate(8deg)}}
    @keyframes shake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(3px)}}
    @keyframes drop{from{opacity:0; transform:translateY(-120px) rotate(-8deg)}}
    @keyframes wiggle{0%,100%{transform:rotate(0)} 25%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} 75%{transform:rotate(-2deg)}}
    @keyframes envOut{to{opacity:0; transform:translateY(90px) scale(.8) rotate(6deg)}}
    @keyframes popIn{from{opacity:0; transform:translateY(60px) scale(.88) rotate(-5deg)}}
    @keyframes marquee{to{transform:translateX(-50%)}}

    /* ===== Trang trí thêm ===== */
    body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
      background:
        radial-gradient(380px 380px at 0% 0%, color-mix(in srgb, var(--pink) 30%, transparent), transparent 70%),
        radial-gradient(440px 440px at 100% 8%, color-mix(in srgb, var(--yellow) 34%, transparent), transparent 70%),
        radial-gradient(480px 480px at 100% 100%, color-mix(in srgb, var(--mint) 30%, transparent), transparent 70%),
        radial-gradient(420px 420px at 0% 100%, color-mix(in srgb, var(--blue) 30%, transparent), transparent 70%)}
    .petals{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
    .petal{position:absolute; top:-50px; left:var(--x); width:var(--s); height:var(--s); fill:var(--c); stroke:var(--line); stroke-width:1.5; stroke-linejoin:round; opacity:.9; animation:fall var(--dur) linear var(--dl) infinite}
    @keyframes fall{0%{transform:translate3d(0,-8vh,0) rotate(0deg)} 50%{transform:translate3d(var(--dx),55vh,0) rotate(190deg)} 100%{transform:translate3d(0,112vh,0) rotate(380deg)}}
    .hint{margin:2px 2px 0; font-size:.8rem; line-height:1.4; color:var(--ink-soft)}
    .squiggle{display:block; width:min(220px,60%); height:14px; margin-top:2px; fill:none; stroke:var(--pink); stroke-width:4; stroke-linecap:round; animation:wipe 1s cubic-bezier(.2,.8,.2,1) 1.3s backwards}
    .st-star2{bottom:6%; left:-4%; --w:38px; --c:var(--blue); --d:-2s}
    .st-heart2{top:-6px; left:44%; --w:30px; --c:var(--mint); --d:-4s}
    .st-heart3{bottom:-24px; left:-18px; --w:46px; --c:var(--pink); --d:-1s}
    .st-spark2{bottom:-14px; right:26px; --w:34px; --c:var(--yellow); --d:-2.5s}
    .nb-st{z-index:2}
    .nb-flower{top:-34px; right:-18px; --w:62px; --c:var(--pink)}
    .nb-heart{bottom:-26px; left:9%; --w:46px; --c:var(--pink); --d:-1.2s}
    .nb-star{bottom:-22px; right:11%; --w:40px; --c:var(--yellow); --d:-2.6s}
    .nb-spark{top:30%; right:-24px; --w:34px; --c:var(--mint); --d:-3.4s}
    .ph-flower{bottom:-22px; right:-20px; --w:54px; --c:var(--blue); z-index:2}
    .ph-heart{top:-16px; left:-20px; --w:38px; --c:var(--pink); --d:-2s; z-index:2}
    .tape.t2{top:auto; bottom:-14px; left:auto; right:-34px; margin:0; width:96px; height:28px; transform:rotate(-38deg); opacity:.92}
    .envelope-wrap{position:relative}
    @media (prefers-reduced-motion: reduce){ .petals{display:none} }

    @media (max-width:860px){
      .gate{grid-template-columns:1fr; min-height:0; gap:34px}
      .st-heart{right:2%}
      .login{transform:rotate(.6deg)}
      .st-flower{right:6px}
    }
    @media (max-width:480px){
      .notebook{padding:var(--lh) 18px var(--lh) 66px}
      .notebook::before{left:10px}
      .notebook{background-image:
        linear-gradient(90deg, transparent 48px, var(--paper-margin) 48px, var(--paper-margin) 50px, transparent 50px),
        repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 2px), var(--paper-line) calc(var(--lh) - 2px), var(--paper-line) var(--lh))}
      .greeting{font-size:1.5rem}
    }
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; animation-delay:0s !important; transition-duration:.01ms !important; transition-delay:0s !important}
      .track{animation:none !important}
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BEFgdGJw.js"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-petal" viewBox="0 0 24 24"><path d="M12 2C18 7 19 14 12 22C5 14 6 7 12 2Z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.3l-6.2 3.8 1.6-7L2 9.3l7.1-.7z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 1c.8 6 3.2 9.2 11 11-7.8 1.8-10.2 5-11 11-.8-6-3.2-9.2-11-11C8.8 10.2 11.2 7 12 1z"/></symbol>
  <symbol id="i-flower" viewBox="0 0 24 24">
    <g><circle cx="12" cy="5.5" r="4.3"/><circle cx="18.2" cy="10" r="4.3"/><circle cx="15.8" cy="17.3" r="4.3"/><circle cx="8.2" cy="17.3" r="4.3"/><circle cx="5.8" cy="10" r="4.3"/></g>
    <circle cx="12" cy="12" r="3.4" style="fill:var(--yellow)"/>
  </symbol>
</svg>

<div class="petals" id="petals" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="stage">

  <section class="gate" id="gate">
    <div class="hero">
      <svg class="sticker st-star" aria-hidden="true"><use href="#i-star"/></svg>
      <svg class="sticker st-heart" aria-hidden="true"><use href="#i-heart"/></svg>
      <svg class="sticker st-spark" aria-hidden="true"><use href="#i-spark"/></svg>
      <svg class="sticker st-star2" aria-hidden="true"><use href="#i-star"/></svg>
      <svg class="sticker st-heart2" aria-hidden="true"><use href="#i-heart"/></svg>
      <p class="tag rise" style="--i:0"><svg aria-hidden="true"><use href="#i-star"/></svg>Lớp 12 Anh 2</p>
      <div class="big" id="big" role="img" aria-label="20/10"></div>
      <h1 class="rise" style="--i:3">Chúc mừng ngày <mark>Phụ nữ Việt Nam</mark></h1>
      <p class="sub rise" style="--i:4">Một món quà nhỏ dành cho các cô gái của lớp.</p>
      <svg class="squiggle" viewBox="0 0 220 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 7Q16 -1 29 7T55 7T81 7T107 7T133 7T159 7T185 7T217 7"/></svg>
    </div>

    <form class="login rise" style="--i:3" id="form" novalidate autocomplete="off">
      <svg class="sticker st-flower" aria-hidden="true"><use href="#i-flower"/></svg>
      <svg class="sticker st-heart3" aria-hidden="true"><use href="#i-heart"/></svg>
      <svg class="sticker st-spark2" aria-hidden="true"><use href="#i-spark"/></svg>
      <h2>Mở thư <svg aria-hidden="true"><use href="#i-heart"/></svg></h2>
      <div class="fields" id="fields">
        <div class="field">
          <label for="name">Tên</label>
          <input id="name" name="name" type="text" placeholder="Họ và tên" maxlength="40" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="next">
        </div>
        <div class="field">
          <label for="dob">Mật khẩu</label>
          <input id="dob" name="dob" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" maxlength="10" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-describedby="dobHint">
          <p class="hint" id="dobHint">Mật khẩu là ngày sinh của bạn. Chỉ cần gõ số, dấu / tự thêm vào.</p>
        </div>
      </div>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn block" id="open" type="submit"><span>Mở thư</span><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-spark"/></svg></button>
    </form>
  </section>

  <section class="reveal" id="reveal" hidden>
    <p class="sr-only" aria-live="polite" id="status"></p>
    <svg class="envelope" id="env" viewBox="0 0 360 260" aria-hidden="true" focusable="false">
      <ellipse class="e-shadow" cx="180" cy="252" rx="150" ry="8"/>
      <rect class="es e-back" x="20" y="62" width="320" height="180" rx="14"/>
      <g transform="translate(0 62)"><path class="es e-flap flap-open" d="M20 0L340 0L180 114Z"/></g>
      <g class="e-paper-g">
        <rect class="e-paper" x="46" y="74" width="268" height="160" rx="8"/>
        <text class="e-name" id="envName" x="180" y="114" font-size="24"></text>

      <svg class="sticker ph-heart" aria-hidden="true"><use href="#i-heart"/></svg>
      <div class="frame"><img id="photoImg" alt=""></div>

      <svg class="sticker nb-st nb-flower" aria-hidden="true"><use href="#i-flower"/></svg>

    <div class="actions">
